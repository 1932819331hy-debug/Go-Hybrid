# Isolated harness only. Publish a tree containing the single validation workflow.
# The checked-out candidate retains its unmodified .github/workflows/ci.yml.
# Every original quick/compiler run step is copied verbatim below.
# CI (quick, on push) — SPEC.md §2: small CI workflow on push.
# Runs: tool syntax checks, runner self-test, job.json validity, doc sanity.
# Deliberately tiny now; grows with the compiler (cargo check, unit tests, compile-fail suite).
name: exact-candidate-goflags-inheritance

on:
  push:
    branches:
      - ci/exact-goflags-inheritance-20261022

permissions:
  contents: read

jobs:
  quick:
    if: github.repository == '1932819331hy-debug/Go-Hybrid' && github.repository_id == '1421338510' && github.repository_owner_id == '343001481'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact goflags-inheritance candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: 1932819331hy-debug/Go-Hybrid
          ref: cf9a1ec8dbad9d3aa8f408f3f0f4a8cb42a1919d
          persist-credentials: false
          fetch-depth: 1
      - name: Verify exact candidate and original CI identity
        shell: bash
        run: |
          set -euo pipefail
          expected_sha='cf9a1ec8dbad9d3aa8f408f3f0f4a8cb42a1919d'
          expected_tree='fbb285901db48d6bdba2884ee4ed7ba82ebaf55b'
          expected_ci_blob='ce9df96250379993538c368c12bf18385a9b8f18'
          expected_ci_sha256='077250e1996970999cf9c66f5656a8b1cbcc74c63f375f9c6704e53a2758d540'
          actual_sha="$(git rev-parse HEAD)"
          actual_tree="$(git rev-parse 'HEAD^{tree}')"
          actual_ci_blob="$(git rev-parse 'HEAD:.github/workflows/ci.yml')"
          printf 'Harness commit: %s\nCandidate commit: %s\nCandidate tree: %s\nCandidate ci.yml blob: %s\n' "$GITHUB_SHA" "$actual_sha" "$actual_tree" "$actual_ci_blob"
          test "$actual_sha" = "$expected_sha"
          test "$actual_tree" = "$expected_tree"
          test "$actual_ci_blob" = "$expected_ci_blob"
          printf '%s  .github/workflows/ci.yml\n' "$expected_ci_sha256" | sha256sum --check --strict
          git diff --exit-code HEAD --
          test -z "$(git status --porcelain --untracked-files=all)"
      - name: Python syntax + self-tests
        run: |
          set -e

          python3 -m py_compile tools/runner/runner.py tools/job.py worker/script.py tools/corpus_harness.py tools/test_corpus_harness.py tools/test_corpus_utf8.py tools/extract_offsets.py tools/test_extract_offsets.py tools/triage_bot.py tools/shepherd.py
          # Fail closed on a committed merge-conflict marker: a marker in a
          # tracked file is invisible to the suites but can make the whole
          # workflow unparseable and take every run (and every PR) down.
          python3 tools/check_conflict_markers.py
          python3 -m unittest discover -s tools -p test_check_conflict_markers.py -v
          python3 -m unittest discover -s tools -p test_shepherd_gate.py -v
          python3 -m unittest discover -s tools -p test_check_corpus_census.py -v
          python3 -m unittest discover -s tools/fuzz -p 'test_hyfuzz.py'
          python3 -m unittest discover -s tools/runner -p test_runner.py -v
          python3 -m unittest discover -s tools -p test_job_cli.py -v
          python3 -m unittest discover -s tools -p test_job_shell_args.py -v
          python3 -m unittest discover -s tools -p test_managed_gate.py -v
          python3 -m unittest discover -s tools -p test_differential_loop.py -v
          python3 -m unittest discover -s tools -p test_differential_output.py -v
          python3 -m unittest discover -s tools -p test_run_examples.py -v
          python3 -m unittest discover -s tools -p test_workload_shape.py -v
          python3 -m unittest discover -s tools -p test_workload_run.py -v
          python3 -m unittest discover -s tools -p test_empty_corpus.py -v
          python3 -m unittest discover -s tools -p test_runner_sha.py -v
          python3 -m unittest discover -s tools -p test_runner_env_report.py -v
          python3 -m unittest discover -s tools -p test_check_versions.py -v
          python3 -m unittest discover -s tools -p test_differential_reject_rule.py -v
          python3 -m unittest discover -s tools -p test_corpus_harness.py -v
          python3 -m unittest discover -s tools -p test_extract_offsets.py -v
          # Suites that had drifted out of this list: a merged regression test
          # nothing invokes cannot fail the build. Registered here and pinned
          # by the guard below so the drift cannot come back silently.
          python3 -m unittest discover -s tools -p test_job_payload.py -v
          python3 -m unittest discover -s tools -p test_job_summary_identity.py -v
          python3 -m unittest discover -s tools -p test_job_download.py -v
          python3 -m unittest discover -s tools -p test_job_revision.py -v
          python3 -m unittest discover -s tools -p test_corpus_error_diagnostics.py -v
          python3 -m unittest discover -s tools -p test_differential_verdict_markers.py -v
          python3 -m unittest discover -s tools -p test_check_test_registration.py -v
          python3 -m unittest discover -s tools -p test_package_version.py -v
          python3 -m unittest discover -s tools -p test_corpus_utf8.py -v
          # Fail closed if any tools/**/test_*.py is matched by no -p pattern
          # above: a suite outside this list would pass CI by never running.
          python3 tools/check_test_registration.py
          # runner self-test: execute a trivial inline job end-to-end
          mkdir -p /tmp/selftest && cd /tmp/selftest
          cat > job.json <<'EOF'
          {
            "job": "ci-selftest", "tier": "actions", "sha": "HEAD", "repo": "none", "gpu": false,
            "setup": [],
            "commands": [
              {"name": "echo", "run": "echo ci-selftest-ok", "timeout": 30},
              {"name": "fail-path-check", "run": "true", "timeout": 30}
            ],
            "expected_results": []
          }
          EOF
          python3 "$GITHUB_WORKSPACE/tools/runner/runner.py" job.json --results-dir results
          test -f results/summary.json
          grep -q '"ok": true' results/summary.json || (cat results/summary.json; exit 1)
      - name: Job specs valid
        run: |
          set -e
          python3 - <<'EOF'
          import glob, json
          specs = glob.glob("jobs/*/job.json")
          assert specs, "no job specs found"
          for p in specs:
              j = json.load(open(p))
              for k in ("job", "sha", "repo", "setup", "commands"):
                  assert k in j, (p, k)
              for s in j["setup"] + j["commands"]:
                  assert "name" in s and "run" in s and "timeout" in s, (p, s)
              for pat in ("ghp_", "gho_", "github_pat_", "KGAT_", "KAGGLE_KEY"):
                  assert pat not in open(p).read(), "secret pattern in " + p
          print("OK:", len(specs), "job specs valid")
          EOF
      - name: Repo hygiene
        run: |
          set -e
          test -f SPEC.md && test -f AGENTS.md && test -f PLAN.md && test -f STATUS.md
          # secrets must never be committed (incl. JWT-shaped session tokens)
          ! git grep -qE 'ghp_[A-Za-z0-9]{20,}|KGAT_[A-Za-z0-9]{20,}|eyJ[A-Za-z0-9_-]{20,}\.[A-Za-z0-9_-]{10,}' HEAD || { echo "SECRET LEAK DETECTED"; exit 1; }
          # Makefile recipes are TAB-indented — Batch I's space-regression (found
          # at the G2/G3 review) broke every target while CI stayed green because
          # CI does not invoke make. A dry-run parses the whole file.
          make -n examples >/dev/null 2>&1 || { echo "MAKEFILE SYNTAX BROKEN (recipes must be TAB-indented)"; exit 1; }
          echo "hygiene OK"
      - name: Installer runtime and checksum verification (offline)
        run: |
          set -e
          # install.sh's generated launcher must keep a caller-provided
          # HYB_RUNTIME_DIR instead of overwriting it with $HYB_HOME/runtime.
          # Self-contained: builds a throwaway release archive, stubs the
          # downloader, and reads back the launcher's env/argv — no network.
          python3 tests/test_install_runtime.py
          python3 tests/test_install_checksums.py
          python3 tests/test_install_upgrade.py

  # The compiler (lands with MVP-0): pinned toolchains, full test suite,
  # corpus verdict agreement, and the walking-skeleton examples end-to-end.
  compiler:
    if: github.repository == '1932819331hy-debug/Go-Hybrid' && github.repository_id == '1421338510' && github.repository_owner_id == '343001481'
    concurrency:
      group: exact-goflags-inheritance-compiler-20261022
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact goflags-inheritance candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: 1932819331hy-debug/Go-Hybrid
          ref: cf9a1ec8dbad9d3aa8f408f3f0f4a8cb42a1919d
          persist-credentials: false
          fetch-depth: 1
      - name: Verify exact candidate and original CI identity
        shell: bash
        run: |
          set -euo pipefail
          expected_sha='cf9a1ec8dbad9d3aa8f408f3f0f4a8cb42a1919d'
          expected_tree='fbb285901db48d6bdba2884ee4ed7ba82ebaf55b'
          expected_ci_blob='ce9df96250379993538c368c12bf18385a9b8f18'
          expected_ci_sha256='077250e1996970999cf9c66f5656a8b1cbcc74c63f375f9c6704e53a2758d540'
          actual_sha="$(git rev-parse HEAD)"
          actual_tree="$(git rev-parse 'HEAD^{tree}')"
          actual_ci_blob="$(git rev-parse 'HEAD:.github/workflows/ci.yml')"
          printf 'Harness commit: %s\nCandidate commit: %s\nCandidate tree: %s\nCandidate ci.yml blob: %s\n' "$GITHUB_SHA" "$actual_sha" "$actual_tree" "$actual_ci_blob"
          test "$actual_sha" = "$expected_sha"
          test "$actual_tree" = "$expected_tree"
          test "$actual_ci_blob" = "$expected_ci_blob"
          printf '%s  .github/workflows/ci.yml\n' "$expected_ci_sha256" | sha256sum --check --strict
          git diff --exit-code HEAD --
          test -z "$(git status --porcelain --untracked-files=all)"
      - name: Install pinned toolchains (same URLs as tools/env.sh discipline)
        run: |
          set -e
          curl -sSL -o /tmp/go.tgz https://go.dev/dl/go1.26.9.linux-amd64.tar.gz
          sudo tar -C /usr/local -xzf /tmp/go.tgz
          curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain 1.99.0
          echo "/usr/local/go/bin:$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Version pins agree (env.sh ↔ README ↔ hyb ↔ PLAN)
        run: |
          set -e
          # Prefer the just-installed pinned toolchains over the runner's
          # preinstalled rustup shim (which has no default toolchain).
          export PATH="$HOME/.cargo/bin:/usr/local/go/bin:$PATH"
          bash tools/check-versions.sh
      - name: Check Corpus Census (every stated count matches the corpus)
        run: make census
      - name: Native GOFLAGS regressions (required real Go)
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.cargo/bin:/usr/local/go/bin:$PATH"
          test "$(go version)" = "go version go1.26.9 linux/amd64"
          go version
          cd compiler
          cargo test -p hyb --test build_goflags -- --test-threads=1 --nocapture
      - name: Compiler tests (hy-diag + hy-syntax + hy-check + hy-emit)
        run: |
          set -e
          cd compiler
          cargo test --workspace --quiet

      - name: Checker corpus verdict agreement (126/122 + tripwire)
        run: |
          set -e
          cd compiler && cargo build -p hyb --quiet
          cd ..
          python3 tools/corpus_harness.py --bin compiler/target/debug/hyb
      - name: Row-13 sample module (existing go.mod integration)
        # The 10-minute story must stay TRUE: vendor-runtime, go generate,
        # ordinary go build/test, and generate --check catching drift.
        run: |
          set -e
          cd compiler && cargo build --release -p hyb --quiet
          cd ../examples/gomod-integration
          HYB=../../compiler/target/release/hyb
          $HYB vendor-runtime .
          $HYB generate .
          go build ./... && go vet ./... && go test ./... && go run .
          $HYB generate --check .
          # semantic drift must FAIL the check (staleness = build failure)
          cp calc.hy /tmp/calc.bak
          sed -i 's/acc += x/acc += 2 * x/' calc.hy
          if $HYB generate --check . >/dev/null 2>&1; then
            echo 'generate --check FAILED to catch semantic drift' >&2; exit 1
          fi
          cp /tmp/calc.bak calc.hy
          $HYB generate --check .
          echo "row-13 sample: OK (build/vet/test/run + drift detection)"
      - name: Managed-block gate (new hatch = review event, row 14)
        # A managed block NOT in gates/managed-baseline.json fails CI;
        # removals are always allowed. Re-baseline WITH review:
        #   python3 tools/managed_gate.py --rebaseline <hyb> gates/managed-baseline.json <prog...>
        run: |
          set -e
          cd compiler && cargo build -p hyb --quiet
          cd ..
          python3 tools/managed_gate.py compiler/target/debug/hyb gates/managed-baseline.json \
            tests/checker-corpus/02-shared-map-managed.hy tests/checker-corpus/18-pool-shared-struct-managed.hy
      - name: Differential corpus loop (accept-side build+run, reject-side checker)
        run: |
          set -e
          python3 tools/differential_loop.py --bin compiler/target/debug/hyb
      - name: Go runtime hygiene (gofmt + vet + build in the hyb workspace shape)
        run: |
          set -e
          # gofmt regression guard — the G2/G3 review caught 5/9 files space-indented
          test -z "$(gofmt -l runtime/go)" || { echo 'NOT GOFMT-CLEAN:'; gofmt -l runtime/go; exit 1; }
          # assemble the module exactly as hyb does (module hybrid.program,
          # bindings import hybrid.program/hybridge, staticlib at lib/)
          rm -rf /tmp/goci && mkdir -p /tmp/goci/lib
          printf 'module hybrid.program\n\ngo 1.26\n' > /tmp/goci/go.mod
          cp -r runtime/go/* /tmp/goci/
          (cd runtime/rust/hyrt && cargo build --release --quiet)
          cp runtime/rust/hyrt/target/release/libhyrt.a /tmp/goci/lib/
          cd /tmp/goci
          go vet ./...
          go build ./...
          go test ./...
          # windows/amd64 compile guard — the community benchmark report
          # (v0.1.0) found the bridge package could not even compile on
          # Windows (the deep-stack pool lived in a _linux-only file).
          # CGO_ENABLED=0 keeps it toolchain-light; this assembles
          # call_win64.s (the Win64 trampolines, row 17) plus the kernel32
          # pool, and go vet checks the whole runtime module.
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build ./hybridge/
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go vet ./hybridge/
          # Darwin must also assemble on every PR; native Rust crossings and
          # guard-page checks run on macOS in the release matrix.
          for arch in arm64 amd64; do
            GOOS=darwin GOARCH="$arch" CGO_ENABLED=0 go build ./hybridge/
            GOOS=darwin GOARCH="$arch" CGO_ENABLED=0 go vet ./hybridge/
          done
          # row 18: the workload triplet's shapes are emitted by shape.py —
          # drift between the generator and the committed programs fails CI.
          # Absolute path: this step `cd /tmp/goci` above, so a repo-relative
          # path did not resolve (shape.py itself is cwd-independent — it
          # locates its files via __file__).
          python3 "$GITHUB_WORKSPACE/benchmarks/workloads/shape.py" --check
          echo "go runtime hygiene OK"
      - name: MVP-0 examples end-to-end (parse → check → emit → go build → run)
        run: |
          set -e
          CARGO_TARGET_DIR="$PWD/compiler/target" bash tools/run_examples.sh
